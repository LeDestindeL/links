<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Destin de L</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="dark">
  <div class="container">
    <img src="logo.png" alt="Logo Le Destin de L" class="logo">
    <h1>Le Destin de L</h1>
    <div class="links">
      <a href="https://www.tiktok.com/@le.destin.de.l">TikTok</a>
      <a href="https://www.instagram.com/ledestindel">Instagram</a>
      <a href="https://youtube.com/@ledestindel">YouTube</a>
    </div>
  </div>

  <button id="modeToggle">☀️ / 🌙</button>

  <script>
    const btn = document.getElementById("modeToggle");
    const body = document.body;

    btn.addEventListener("click", () => {
      body.classList.toggle("dark");
      localStorage.setItem("theme", body.classList.contains("dark") ? "dark" : "light");
    });

    if (localStorage.getItem("theme") === "light") {
      body.classList.remove("dark");
    }
  </script>
</body>
</html>
